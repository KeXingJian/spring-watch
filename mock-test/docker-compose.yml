version: '3.8'

services:
  mock-test:
    build:
      context: .
      dockerfile: Dockerfile
      additional_contexts:
        - agent=../spring-watch-agent
        - sdk=../spring-watch-sdk
    image: mock-test:1.0.0
    container_name: mock-test
    ports:
      - "8081:8081"
      - "9464:9464"
    environment:
      - TZ=Asia/Shanghai
      - SW_APP_NAME=mock-test
      - SW_METRICS_PORT=9464
      - SW_SQL_SLOW_MS=200
      - JAVA_OPTS=-Xmx512m
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/api/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
